plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.4'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.learn'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

jacoco {
	toolVersion = "0.8.13"
	reportsDirectory = layout.buildDirectory.dir('reports/jacoco')
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	runtimeOnly 'com.h2database:h2'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'
	implementation 'io.micrometer:micrometer-tracing-bridge-brave'
	implementation("net.logstash.logback:logstash-logback-encoder:8.1")
}

bootJar { // flat jar
	archiveFileName = "springbootdemo.jar"
}

/* ---------- Default test task: show per-test status + summary ---------- */
test {
	useJUnitPlatform()
	finalizedBy(tasks.jacocoTestReport)

	// Per-test lines like: PASSED, FAILED, SKIPPED
	testLogging {
		events "PASSED", "FAILED", "SKIPPED"
		exceptionFormat "FULL"
		showExceptions true
		showCauses true
		showStackTraces true
	}

	// Final summary after all tests
	afterSuite { desc, result ->
		if (!desc.parent) { // will match the root suite
			println "\n================= TEST SUMMARY ================="
			println "Total tests   : ${result.testCount}"
			println "Passed        : ${result.successfulTestCount}"
			println "Failed        : ${result.failedTestCount}"
			println "Skipped       : ${result.skippedTestCount}"
			println "==============================================="
		}
	}
}



/* Generate the HTML/XML coverage report */
tasks.jacocoTestReport {
	dependsOn tasks.test
	reports {
		xml.required = false
		csv.required = false
		html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
	}
}

tasks.register('coverageReport') {
	group = 'verification'
	description = 'Generate JaCoCo test coverage report'
	dependsOn tasks.jacocoTestReport
}

/* (Optional) fail build if coverage below threshold */
tasks.register('coverageVerify', JacocoCoverageVerification) {
	dependsOn tasks.test
	violationRules {
		rule {
			limit {
				counter = 'INSTRUCTION'    // or LINE, BRANCH, etc.
				value   = 'COVERED_RATIO'
				minimum = 0.65             // set your desired minimum
			}
		}
	}
}
