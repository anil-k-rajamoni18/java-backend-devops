<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f9fafb;
            color: #111827;
            display: flex;
            justify-content: center;
            padding: 4rem 1rem; /* add top/bottom padding so it's not glued to edges */
            min-height: 100vh;  /* ensure full viewport height but allow scrolling */
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            margin: 0;
            color: #dc2626;
            word-wrap: break-word; /* prevent overflow */
        }
        h2 {
            margin-top: 0.5rem;
            font-size: 1.5rem;
            color: #374151;
        }
        p {
            margin-top: 1rem;
            font-size: 1rem;
            color: #6b7280;
            word-wrap: break-word;
        }
        a {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.6rem 1.2rem;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 0.5rem;
            font-weight: 500;
        }
        a:hover {
            background: #1e40af;
        }
    </style>
</head>
<body>
<div class="card">
    <h1 th:text="${status}">Error</h1>
    <h2 th:text="${error}">Something went wrong</h2>
    <p th:text="${message}">An unexpected error occurred. Please try again later.</p>
    <p th:text="${path}"></p>
    <a href="/">Go Home</a>
</div>
</body>
</html>
